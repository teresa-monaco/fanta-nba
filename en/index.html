<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- English version: same app, same files. The base points one level up,
       so scripts, styles and data load from the shared folders, while the
       address stays /en/ — which is how the app knows to speak English. -->
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0d11">
  <meta name="description" content="Fanta NBA: a credit auction between friends, lineups, simulated playoffs. Runs in the browser, nothing to install.">
  <title>Fanta NBA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏀</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏀</text></svg>">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="brand">FANTA<span>NBA</span></div>
  </header>

  <main id="app">
    <div class="card center muted">Loading…</div>
  </main>

  <noscript>
    <div style="padding:16px;color:#e8ecf4">This game needs JavaScript enabled.</div>
  </noscript>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
